name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        # v7+ is required for golangci-lint v2 (v6 only supports v1.x).
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

      - name: Unit tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build bt
        run: go build -o bt ./cmd/bt

      - name: Build orders-api
        run: go build -o orders-api ./examples/orders-api

      - name: Start orders-api
        run: ./orders-api &
        env:
          PORT: "8080"

      - name: Wait for orders-api
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              exit 0
            fi
            echo "waiting for orders-api... ($i)"
            sleep 1
          done
          echo "orders-api did not become ready"
          exit 1

      - name: Ensure bt report directory
        run: mkdir -p examples/orders-api/bt/.bt/reports

      - name: Integration tests (passing cases)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table

      - name: Integration tests (JSON output)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table --output json

      - name: Integration tests (fuzz strategy, safe profile)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy fuzz --safety safe --fuzz-iterations 20

      - name: Integration tests (JUnit to artifact)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table --output junit > examples/orders-api/bt/.bt/reports/results.xml

      - name: Integration tests (expected failures — artifact production)
        run: ./bt run --config examples/orders-api/bt/backendtest-failures.yaml --strategy table || true

      - name: Verify artifact was produced
        run: |
          ARTIFACT_DIR="examples/orders-api/bt/.bt/artifacts"
          COUNT=$(ls "$ARTIFACT_DIR"/*.json 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: No artifact was produced by the expected-failure run"
            exit 1
          fi
          echo "OK: $COUNT artifact(s) found"
          ls -la "$ARTIFACT_DIR"

      - name: Replay most recent artifact
        run: |
          ARTIFACT_DIR="examples/orders-api/bt/.bt/artifacts"
          LATEST=$(ls -t "$ARTIFACT_DIR"/*.json | head -1)
          echo "Replaying: $LATEST"
          ./bt replay --config examples/orders-api/bt/backendtest.yaml "$LATEST" || true

      - name: Upload bt artifacts (.bt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-artifacts
          path: examples/orders-api/bt/.bt/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: examples/orders-api/bt/.bt/reports/
          retention-days: 7
