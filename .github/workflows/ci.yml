name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        # v7+ is required for golangci-lint v2 (v6 only supports v1.x).
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

      - name: Unit tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build bt
        run: go build -o bt ./cmd/bt

      - name: Build graphql-api
        run: go build -o graphql-api ./examples/graphql-api

      - name: Start graphql-api
        run: ./graphql-api &
        env:
          PORT: "8090"

      - name: Wait for graphql-api
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8090/health; then
              exit 0
            fi
            echo "waiting for graphql-api... ($i)"
            sleep 1
          done
          echo "graphql-api did not become ready"
          exit 1

      - name: Ensure graphql-api bt report directory
        run: mkdir -p examples/graphql-api/bt/.bt/reports examples/graphql-api/bt/.bt/artifacts

      - name: GraphQL — bt table
        run: ./bt run --config examples/graphql-api/bt/backendtest.yaml --strategy table --exclude gql-schema-violation-acceptance-test

      - name: GraphQL — bt JSON
        run: ./bt run --config examples/graphql-api/bt/backendtest.yaml --strategy table --exclude gql-schema-violation-acceptance-test --output json

      - name: GraphQL — bt JUnit
        if: always()
        run: ./bt run --config examples/graphql-api/bt/backendtest.yaml --strategy table --exclude gql-schema-violation-acceptance-test --output junit

      - name: GraphQL — M11.5 server property shapes (httptest)
        run: |
          go test ./examples/graphql-api/... -race -count=1 -run 'TestCreateOrder_PropertyShape|TestOrderQuery_PropertyShape' -v
          BT_GQL_AMOUNT_BUG=1 go test ./examples/graphql-api/... -race -count=1 -run TestOrderQuery_BrokenResolver -v

      - name: GraphQL — validate property configs
        run: |
          ./bt validate --config examples/graphql-api/bt/backendtest-property.yaml --output json
          ./bt validate --config examples/graphql-api/bt/backendtest-property-bug.yaml --output json

      - name: GraphQL — property strategy (healthy server)
        run: ./bt run --config examples/graphql-api/bt/backendtest-property.yaml --strategy property --adapter graphql

      - name: GraphQL — M11.5 integration (property + MCP)
        run: |
          go test -tags=integration ./examples/graphql-api/bt/tests/... -race -count=1 -v
          go test -tags=integration ./examples/graphql-api -race -count=1 -run TestPropertyRun -v

      - name: GraphQL — Go integration tests
        run: go test -tags=integration ./examples/graphql-api/integration/... -race -count=1

      - name: GraphQL — schema violation acceptance (httptest)
        run: go test -tags=integration ./examples/graphql-api -race -count=1 -run TestGQLSchemaViolationAcceptance -v

      - name: GraphQL — amount bug detection + property on buggy server + replay
        run: |
          set -e
          mkdir -p examples/graphql-api/bt/.bt/artifacts
          BT_GQL_AMOUNT_BUG=1 ./graphql-api --port 8091 &
          echo $! > /tmp/graphql-api-8091.pid
          sleep 1
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8091/health; then break; fi
            sleep 0.2
          done
          curl -sf http://localhost:8091/health >/dev/null
          GRAPHQL_BT_CONFIG=examples/graphql-api/bt/backendtest-bug.yaml BT_GQL_AMOUNT_BUG=1 go test ./examples/graphql-api/integration/... -tags=integration -run TestGraphQLRun_AmountBugDetected -count=1 -v
          set +e
          ./bt run --config examples/graphql-api/bt/backendtest-property-bug.yaml --strategy property --adapter graphql --checks 50 --output json > gql-property-bug.json
          bt_exit=$?
          set -e
          if [ "$bt_exit" -eq 0 ]; then
            echo "ERROR: property run should have failed on buggy server"
            exit 1
          fi
          if ! grep -q amount gql-property-bug.json; then
            echo "ERROR: expected 'amount' in property JSON output"
            cat gql-property-bug.json
            exit 1
          fi
          ARTIFACT=$(ls examples/graphql-api/bt/.bt/artifacts/*.json 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "ERROR: expected a property failure artifact under examples/graphql-api/bt/.bt/artifacts"
            exit 1
          fi
          if ! grep -q '"seed"' "$ARTIFACT"; then
            echo "ERROR: artifact missing seed"
            cat "$ARTIFACT"
            exit 1
          fi
          kill "$(cat /tmp/graphql-api-8091.pid)" 2>/dev/null || true
          sleep 0.5
          ./graphql-api --port 8091 &
          echo $! > /tmp/graphql-api-8091.pid
          sleep 1
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8091/health; then break; fi
            sleep 0.2
          done
          curl -sf http://localhost:8091/health >/dev/null
          ./bt replay --config examples/graphql-api/bt/backendtest-property-bug.yaml "$ARTIFACT"
          kill "$(cat /tmp/graphql-api-8091.pid)" 2>/dev/null || true

      - name: Upload GraphQL bt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphql-test-results
          path: |
            examples/graphql-api/bt/.bt/reports/
            examples/graphql-api/bt/.bt/artifacts/
            gql-property-bug.json
          retention-days: 7

      - name: MCP stdio test client
        run: go test ./internal/mcp/testclient/... -race -count=1

      - name: MCP call CLI (subprocess)
        run: go test ./internal/cli/... -run 'TestMCPCallCommand_(UnknownTool|ValidTool)' -count=1

      - name: Build orders-api
        run: go build -o orders-api ./examples/orders-api

      - name: Start orders-api
        run: ./orders-api &
        env:
          PORT: "8080"

      - name: Wait for orders-api
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              exit 0
            fi
            echo "waiting for orders-api... ($i)"
            sleep 1
          done
          echo "orders-api did not become ready"
          exit 1

      - name: Ensure bt report directory
        run: mkdir -p examples/orders-api/bt/.bt/reports

      - name: Integration tests (passing cases)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table --exclude schema-violation-acceptance-test

      - name: Integration tests (JSON output)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table --exclude schema-violation-acceptance-test --output json

      - name: Integration tests (fuzz strategy, safe profile)
        run: |
          ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy fuzz --safety safe --fuzz-iterations 20 \
            || true
        # Fuzz records schema/status findings as case failures; exit code is non-zero.
        # M5.5 verifies JSON report shape and DELETE safety separately.

      - name: Integration tests (JUnit to artifact)
        run: ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table --exclude schema-violation-acceptance-test --output junit > examples/orders-api/bt/.bt/reports/results.xml

      - name: Orders API — schema violation acceptance (httptest)
        run: go test -tags=integration ./examples/orders-api -race -count=1 -run TestSchemaViolationAcceptance -v

      - name: Integration tests (expected failures — artifact production)
        run: ./bt run --config examples/orders-api/bt/backendtest-failures.yaml --strategy table || true

      - name: Verify artifact was produced
        run: |
          ARTIFACT_DIR="examples/orders-api/bt/.bt/artifacts"
          COUNT=$(ls "$ARTIFACT_DIR"/*.json 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: No artifact was produced by the expected-failure run"
            exit 1
          fi
          echo "OK: $COUNT artifact(s) found"
          ls -la "$ARTIFACT_DIR"

      - name: Replay most recent artifact
        run: |
          ARTIFACT_DIR="examples/orders-api/bt/.bt/artifacts"
          LATEST=$(ls -t "$ARTIFACT_DIR"/*.json | head -1)
          echo "Replaying: $LATEST"
          ./bt replay --config examples/orders-api/bt/backendtest.yaml "$LATEST" || true

      # M4.5 — property strategy integration tests
      - name: Property tests (broken endpoint + create endpoint)
        run: |
          ./bt run \
            --config examples/orders-api/bt/backendtest-property.yaml \
            --strategy property \
            --output json \
            --output-file examples/orders-api/bt/.bt/reports/property-run.json \
          || true

      - name: Verify property tests found broken endpoint
        run: |
          REPORT="examples/orders-api/bt/.bt/reports/property-run.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: property run report not produced"
            exit 1
          fi
          echo "Report produced. Contents:"
          jq '.results | length' "$REPORT" || cat "$REPORT"

          FAILURES=$(jq '[.results[].failures[]? | select(.invariant == "response_matches_schema")] | length' "$REPORT")
          if [ "$FAILURES" -eq 0 ]; then
            echo "FAIL: property testing did not find a response_matches_schema failure"
            exit 1
          fi
          echo "OK: found $FAILURES response_matches_schema failure(s)"

      - name: Verify property violation paths are populated
        run: |
          REPORT="examples/orders-api/bt/.bt/reports/property-run.json"
          EMPTY_PATHS=$(jq '[.results[].failures[]? | select(.invariant == "response_matches_schema" and (.path == null or .path == ""))] | length' "$REPORT")
          if [ "$EMPTY_PATHS" -gt 0 ]; then
            echo "FAIL: $EMPTY_PATHS schema violation(s) have empty path fields"
            exit 1
          fi
          echo "OK: all schema violations have populated path fields"

      - name: Verify property run seed is logged
        run: |
          REPORT="examples/orders-api/bt/.bt/reports/property-run.json"
          ZERO_SEEDS=$(jq '[.results[] | select(.strategy_kind == "property" and (.seed == null or .seed == 0))] | length' "$REPORT")
          if [ "$ZERO_SEEDS" -gt 0 ]; then
            echo "FAIL: $ZERO_SEEDS property result(s) have no seed logged"
            exit 1
          fi
          echo "OK: all property results have seeds logged"

      # M5.5 — fuzz strategy integration (orders API + delete counter proof)
      - name: Fuzz integration (safe profile, JSON report)
        run: |
          ./bt run \
            --config examples/orders-api/bt/backendtest-fuzz.yaml \
            --strategy fuzz \
            --safety safe \
            --fuzz-iterations 50 \
            --output json \
            --output-file examples/orders-api/bt/.bt/reports/fuzz-run.json \
          || true

      - name: Verify safety — zero DELETE requests during fuzz run
        run: |
          COUNT=$(curl -sf http://localhost:8080/admin/delete-count | jq '.delete_attempts')
          echo "DELETE attempts after fuzz run: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "FAIL: safe profile must not send DELETE; saw $COUNT attempt(s)"
            exit 1
          fi
          echo "OK: zero DELETE requests"

      - name: Verify fuzz report and classifications
        run: |
          REPORT="examples/orders-api/bt/.bt/reports/fuzz-run.json"
          if [ ! -f "$REPORT" ]; then
            echo "FAIL: fuzz run report not produced"
            exit 1
          fi
          FAILURES=$(jq '[.results[].failures[]?] | length' "$REPORT")
          if [ "$FAILURES" -eq 0 ]; then
            echo "FAIL: expected at least one fuzz failure (schema or status mismatch)"
            exit 1
          fi
          MISSING=$(jq '[.results[].failures[]? | select(.classification == null or .classification == "")] | length' "$REPORT")
          if [ "$MISSING" -gt 0 ]; then
            echo "FAIL: $MISSING fuzz failure(s) have empty classification"
            exit 1
          fi
          SCHEMA=$(jq '[.results[] | select(.case_id=="fuzz:GetOrderBroken") | .failures[]? | select(.classification=="schema_break")] | length' "$REPORT")
          if [ "$SCHEMA" -eq 0 ]; then
            echo "FAIL: expected schema_break on GetOrderBroken"
            exit 1
          fi
          echo "OK: fuzz report and classifications look sane"

      # M6.5 — MCP server smoke tests (stdio + bt mcp call)
      - name: MCP smoke — bt_validate via CLI JSON
        run: |
          ./bt validate \
            --config examples/orders-api/bt/backendtest.yaml \
            --output json \
          | jq -e '.valid == true' > /dev/null
          echo "OK: bt_validate reports config is valid"

      - name: MCP smoke — bt_discover_operations response schema
        run: |
          RESULT=$(./bt mcp call bt_discover_operations \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml"}' \
            --output json)
          echo "$RESULT" | jq -e '.operation_count > 0' > /dev/null
          echo "$RESULT" | jq -e '.operations | length > 0' > /dev/null
          echo "$RESULT" | jq -e '.operations[0] | has("id") and has("method") and has("path")' > /dev/null
          echo "OK: bt_discover_operations returned valid operation list"

      - name: MCP smoke — bt_run response schema
        run: |
          RESULT=$(./bt mcp call bt_run \
            --input '{"config_path":"examples/orders-api/bt/backendtest.yaml","strategy":"table"}' \
            --output json)
          echo "$RESULT" | jq -e 'has("passed") and has("failed") and has("total") and has("strategy") and has("artifact_dir")' > /dev/null
          echo "$RESULT" | jq -e '.passed + .failed + .skipped == .total' > /dev/null
          echo "OK: bt_run response is well-formed"

      - name: MCP smoke — bt_run then bt_explain_failure chain
        run: |
          RUN_RESULT=$(./bt mcp call bt_run \
            --input '{"config_path":"examples/orders-api/bt/backendtest-failures.yaml","strategy":"table"}' \
            --output json) || true

          FAILURE_COUNT=$(echo "$RUN_RESULT" | jq '.failures | length')
          if [ "$FAILURE_COUNT" -eq 0 ]; then
            echo "No failures produced — skipping explain chain"
            exit 0
          fi

          ARTIFACT=$(echo "$RUN_RESULT" | jq -r '.failures[0].artifact_path')
          echo "Explaining artifact: $ARTIFACT"

          EXPLAIN_RESULT=$(./bt mcp call bt_explain_failure \
            --input "$(jq -cn --arg p "$ARTIFACT" '{artifact_path:$p}')" \
            --output json)
          echo "$EXPLAIN_RESULT" | jq -e 'has("case_id") and has("request") and has("response") and has("replay_command")' > /dev/null
          echo "$EXPLAIN_RESULT" | jq -e '.replay_command | contains("bt replay")' > /dev/null
          echo "OK: bt_explain_failure returned full failure detail"

      - name: MCP smoke — bt_scaffold_config produces valid config
        run: |
          SCAFFOLD=$(./bt mcp call bt_scaffold_config \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","base_url":"http://localhost:8080"}' \
            --output json)
          echo "$SCAFFOLD" | jq -e '.config_yaml | length > 0' > /dev/null
          echo "$SCAFFOLD" | jq -r '.config_yaml' > /tmp/scaffolded-mcp.yaml

          VALIDATE=$(./bt validate --config /tmp/scaffolded-mcp.yaml --output json)
          echo "$VALIDATE" | jq -e '.valid == true' > /dev/null
          echo "OK: scaffolded config passes validation"

      # M7.5 — AI scaffold layer (stub path; always runs)
      - name: AI scaffold — bt_suggest_invariants (stub path, CreateOrder)
        run: |
          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"CreateOrder"}' \
            --output json)

          echo "Response:"
          echo "$RESULT" | jq .

          echo "$RESULT" | jq -e '.operation_id == "CreateOrder"' > /dev/null
          echo "$RESULT" | jq -e '.provider != null and .provider != ""' > /dev/null
          echo "$RESULT" | jq -e '.suggestions | length > 0' > /dev/null
          echo "$RESULT" | jq -e '.suggestions[0] | has("name") and has("rationale") and has("confidence") and has("invariant_type")' > /dev/null
          echo "OK: bt_suggest_invariants returned valid structured suggestions"

      - name: AI scaffold — suggestions confidence values are valid
        run: |
          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"CreateOrder"}' \
            --output json)

          INVALID=$(echo "$RESULT" | jq '[.suggestions[] | select(.confidence as $c | (["high","medium","low"] | index($c)) == null)] | length')
          if [ "$INVALID" -gt 0 ]; then
            echo "FAIL: $INVALID suggestion(s) have invalid confidence values"
            echo "$RESULT" | jq '.suggestions[] | {name,confidence}'
            exit 1
          fi
          echo "OK: all confidence values are valid"

      - name: AI scaffold — suggestions invariant_type values are valid
        run: |
          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"CreateOrder"}' \
            --output json)

          INVALID=$(echo "$RESULT" | jq '[.suggestions[] | select(.invariant_type as $t | (["no_5xx","response_matches_schema","idempotency","custom"] | index($t)) == null)] | length')
          if [ "$INVALID" -gt 0 ]; then
            echo "FAIL: $INVALID suggestion(s) have invalid invariant_type values"
            echo "$RESULT" | jq '.suggestions[] | {name,invariant_type}'
            exit 1
          fi
          echo "OK: all invariant_type values are valid"

      - name: AI scaffold — bt_suggest_invariants for GetOrderBroken
        run: |
          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"GetOrderBroken"}' \
            --output json)
          echo "$RESULT" | jq -e '.operation_id == "GetOrderBroken"' > /dev/null
          echo "$RESULT" | jq -e '.suggestions | length > 0' > /dev/null
          echo "OK: bt_suggest_invariants works for GetOrderBroken"

      - name: AI scaffold — bt_suggest_strategy returns provider field
        run: |
          RESULT=$(./bt mcp call bt_suggest_strategy \
            --input '{"operations":[{"id":"CreateOrder","method":"POST","has_body":true}]}' \
            --output json)
          echo "$RESULT" | jq -e '.provider != null and .provider != ""' > /dev/null
          echo "$RESULT" | jq -e '.recommendations | length > 0' > /dev/null
          echo "OK: bt_suggest_strategy returns provider field"

      - name: AI scaffold — unknown operation returns OPERATION_NOT_FOUND
        run: |
          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"DoesNotExist"}' \
            --output json)
          echo "$RESULT" | jq -e '.code == "OPERATION_NOT_FOUND"' > /dev/null
          echo "OK: unknown operation returns structured error"

      # M7.5 — AI-path smoke (optional). secrets cannot be used in step `if:`; pass via env and skip in shell when unset.
      - name: AI scaffold — real provider smoke (optional, ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "Skipping optional AI smoke — ANTHROPIC_API_KEY secret not set or empty"
            exit 0
          fi
          echo "API key present — running real AI provider smoke tests"

          RESULT=$(./bt mcp call bt_suggest_invariants \
            --input '{"schema_path":"examples/orders-api/spec/openapi.yaml","operation_id":"CreateOrder"}' \
            --output json)

          echo "AI response (suggest_invariants):"
          echo "$RESULT" | jq .

          PROVIDER=$(echo "$RESULT" | jq -r '.provider')
          if [ "$PROVIDER" != "ai" ]; then
            echo "FAIL: expected provider=ai when API key is set, got $PROVIDER"
            exit 1
          fi

          echo "$RESULT" | jq -e '.suggestions | length > 0' > /dev/null
          echo "$RESULT" | jq -e '.suggestions[0] | has("name") and has("rationale") and has("confidence") and has("invariant_type")' > /dev/null

          SHORT_RATIONALES=$(echo "$RESULT" | jq '[.suggestions[] | select((.rationale | length) < 20)] | length')
          if [ "$SHORT_RATIONALES" -gt 0 ]; then
            echo "FAIL: $SHORT_RATIONALES suggestion(s) have suspiciously short rationale from real AI"
            echo "$RESULT" | jq '.suggestions[] | {name, rationale}'
            exit 1
          fi

          echo "OK: real AI provider returned valid structured suggestions with substantive rationale"

          RESULT=$(./bt mcp call bt_suggest_strategy \
            --input '{"operations":[
              {"id":"CreateOrder","method":"POST","has_body":true},
              {"id":"GetOrder","method":"GET","has_body":false},
              {"id":"GetOrderBroken","method":"GET","has_body":false}
            ]}' \
            --output json)

          PROVIDER=$(echo "$RESULT" | jq -r '.provider')
          if [ "$PROVIDER" != "ai" ]; then
            echo "FAIL: expected provider=ai for bt_suggest_strategy, got $PROVIDER"
            exit 1
          fi

          EMPTY=$(echo "$RESULT" | jq '[.recommendations[].strategies[] | select(.rationale == "" or .rationale == null)] | length')
          if [ "$EMPTY" -gt 0 ]; then
            echo "FAIL: $EMPTY strategy entries have empty rationale from AI provider"
            exit 1
          fi
          echo "OK: AI-backed bt_suggest_strategy returned substantive rationale"

      - name: Go integration tests (property + fuzz + MCP)
        run: go test -tags=integration ./examples/orders-api/integration/... -count=1

      - name: Upload property run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-run-report
          path: examples/orders-api/bt/.bt/reports/property-run.json
          retention-days: 7

      - name: Upload bt artifacts (.bt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt-artifacts
          path: examples/orders-api/bt/.bt/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: examples/orders-api/bt/.bt/reports/
          retention-days: 7
