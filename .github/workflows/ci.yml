name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        # v7+ is required for golangci-lint v2 (v6 only supports v1.x).
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Build
        run: go build ./cmd/bt
