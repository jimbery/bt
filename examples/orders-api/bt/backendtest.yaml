# Paths are relative to the process working directory (repo root when running:
#   ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy table
#   ./bt run --config examples/orders-api/bt/backendtest.yaml --strategy property [--seed 42] [--checks 50]
# from the repository root, matching CI.)
version: 1

baseline: baseline.yaml

target:
  name: orders-api
  base_url: http://localhost:8080
  schema: examples/orders-api/spec/openapi.yaml

strategies:
  - type: table
    file: examples/orders-api/bt/cases/table.yaml

  - type: stateful
    config:
      flows_dir: flows

  # Property checks (Rapid): start the API on target.base_url first.
  # GetHealth + ListOrders are read-only GETs with stable 200 + JSON schemas.
  - type: property
    operations:
      - GetHealth
      - ListOrders
    invariants:
      - no_5xx
    config:
      checks: 30

  # Fuzz (M5 / M5.5): smoke uses only the baseline-quarantined operation so
  # `make integration` and `bt run --strategy fuzz` exit 0 while still exercising
  # the fuzz path. Multi-op fuzz coverage lives in backendtest-fuzz.yaml and CI.
  - type: fuzz
    operations:
      - GetOrderBroken
    config:
      fuzz_iterations: 20

  # Contract: minimal requests per operation; response vs OpenAPI schemas.
  - type: contract
    operations:
      - GetHealth
      - ListOrders
      - CreateOrder
      - GetOrder
      - GetOrderBroken

report:
  formats: [console, json, junit]
  output_dir: examples/orders-api/bt/.bt/reports

safety:
  profile: safe
  deny_methods: []
