flows:
  - id: create-and-cancel-order
    description: "Create an order and cancel it — verifies cancelled_at field is set"
    steps:
      - id: create
        operation_id: CreateOrder
        input:
          method: POST
          path: /orders
          headers:
            Content-Type: application/json
          body:
            amount: 200
            currency: EUR
        expected:
          status_code: 201
          schema:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { type: string }
        extract:
          order_id:
            from: "$.id"
            into: path

      - id: cancel
        operation_id: UpdateOrder
        input:
          method: PATCH
          path: "/orders/{order_id}"
          headers:
            Content-Type: application/json
          body:
            status: cancelled
        expected:
          status_code: 200
          schema:
            type: object
            required: [id, status, cancelled_at]
            properties:
              id: { type: string }
              status: { type: string, enum: [cancelled] }
              cancelled_at: { type: string }
