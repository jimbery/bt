cases:
  # ── Health ──────────────────────────────────────────────────────────────

  - id: health-returns-200
    operation_id: GetHealth
    input:
      method: GET
      path: /health
    expected:
      status_code: 200
      schema:
        type: object
        required: [status]
        properties:
          status:
            type: string
            enum: [ok]
        additionalProperties: false

  # ── List Orders ──────────────────────────────────────────────────────────

  - id: list-orders-empty
    operation_id: ListOrders
    input:
      method: GET
      path: /orders
    expected:
      status_code: 200
      schema:
        type: object
        required: [orders, total]
        properties:
          orders:
            type: array
            items:
              $ref: "#/components/schemas/Order"
          total:
            type: integer
        additionalProperties: false

  - id: list-orders-filter-pending
    operation_id: ListOrders
    input:
      method: GET
      path: /orders
      query:
        status: pending
    expected:
      status_code: 200
      schema:
        type: object
        required: [orders, total]
        properties:
          orders:
            type: array
            items:
              $ref: "#/components/schemas/Order"
          total:
            type: integer
        additionalProperties: false

  - id: list-orders-filter-invalid
    operation_id: ListOrders
    input:
      method: GET
      path: /orders
      query:
        status: not_a_real_status
    expected:
      status_code: 400
      schema:
        $ref: "#/components/schemas/Error"

  # ── Create Order ─────────────────────────────────────────────────────────

  - id: create-order-valid
    operation_id: CreateOrder
    input:
      method: POST
      path: /orders
      headers:
        Content-Type: application/json
      body:
        amount: 100
        currency: GBP
        description: Integration test order
    expected:
      status_code: 201
      schema:
        $ref: "#/components/schemas/Order"

  - id: create-order-missing-amount
    operation_id: CreateOrder
    input:
      method: POST
      path: /orders
      headers:
        Content-Type: application/json
      body:
        currency: GBP
    expected:
      status_code: 400
      schema:
        $ref: "#/components/schemas/Error"

  - id: create-order-missing-currency
    operation_id: CreateOrder
    input:
      method: POST
      path: /orders
      headers:
        Content-Type: application/json
      body:
        amount: 100
    expected:
      status_code: 400
      schema:
        $ref: "#/components/schemas/Error"

  - id: create-order-negative-amount
    operation_id: CreateOrder
    input:
      method: POST
      path: /orders
      headers:
        Content-Type: application/json
      body:
        amount: -1
        currency: GBP
    expected:
      status_code: 400
      schema:
        $ref: "#/components/schemas/Error"

  # ── Get Order ─────────────────────────────────────────────────────────────

  - id: get-order-not-found
    operation_id: GetOrder
    input:
      method: GET
      path: /orders/does-not-exist
    expected:
      status_code: 404
      schema:
        $ref: "#/components/schemas/Error"

  # ── Deliberately wrong schema (acceptance test for violation reporting) ──

  - id: schema-violation-acceptance-test
    operation_id: CreateOrder
    input:
      method: POST
      path: /orders
      headers:
        Content-Type: application/json
      body:
        amount: 100
        currency: GBP
    expected:
      status_code: 201
      schema:
        type: object
        required: [id, amount, currency, status, created_at]
        properties:
          id:
            type: string
          amount:
            type: string
          currency:
            type: string
          status:
            type: string
          created_at:
            type: string
