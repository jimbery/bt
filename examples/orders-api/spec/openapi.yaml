openapi: "3.0.3"
info:
  title: Orders API
  description: Example orders API used as a bt integration test target
  version: "1.0.0"

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      operationId: GetHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /orders:
    get:
      operationId: ListOrders
      summary: List orders
      tags: [orders]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, shipped, delivered, cancelled]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          description: Invalid status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      operationId: CreateOrder
      summary: Create an order
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Order amount in minor currency units
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  description: ISO 4217 currency code
                description:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/{id}:
    get:
      operationId: GetOrder
      summary: Get an order by ID
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: UpdateOrder
      summary: Update order status
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, shipped, delivered, cancelled]
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: DeleteOrder
      summary: Delete an order (requires confirmation header)
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Confirm-Delete
          in: header
          required: false
          schema:
            type: string
            enum: ["yes"]
      responses:
        "204":
          description: Order deleted successfully
        "400":
          description: Confirmation header missing
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [MISSING_CONFIRM]
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [NOT_FOUND]

  /orders/{id}/broken:
    get:
      operationId: GetOrderBroken
      summary: Intentionally inconsistent endpoint (for property testing)
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order (sometimes incomplete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/delete-count:
    get:
      operationId: GetDeleteCount
      summary: Returns the number of DELETE attempts received (for safety verification)
      tags: [admin]
      responses:
        "200":
          description: Delete attempt count
          content:
            application/json:
              schema:
                type: object
                required: [delete_attempts]
                properties:
                  delete_attempts:
                    type: integer
                    minimum: 0

components:
  schemas:
    Order:
      type: object
      required: [id, amount, currency, status, created_at]
      properties:
        id:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
